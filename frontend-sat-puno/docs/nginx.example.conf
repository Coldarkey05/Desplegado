# Ejemplo: frontend y backend bajo el mismo origen.
# Antes de compilar: VITE_API_URL=/api y VITE_SOCKET_URL=https://colas.tu-dominio.pe
# Adaptar dominio y certificados HTTPS. Este bloque HTTP es solo ilustrativo.
server {
    listen 80;
    server_name colas.tu-dominio.pe;
    root /var/www/sat-puno/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# Si usas un proxy, configura de forma explícita la confianza en ese proxy en
# Nest/Express antes de usar limitadores por IP; no confíes en todos los proxies.
# Añade HTTPS y el origen exacto a CORS_ORIGINS del backend.
